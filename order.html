<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art&Ink Studio – Order</title>
  <link rel="stylesheet" href="style.css">

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
  <div class="container">

    <h1 class="brand">
      <span class="brand-gradient">Art&Ink Studio</span>
    </h1>

    <p class="subtitle" id="item-text"></p>
    <div id="error" class="error" style="display:none"></div>

    <!-- EMAIL -->
    <label class="label">
      Email address
      <input id="email" type="email" required>
    </label>

    <!-- PHONE -->
    <label class="label">
      Phone number
      <input id="phone" type="tel">
    </label>

    <!-- QUANTITY -->
    <label class="label">
      Quantity
      <input id="qty" type="number" min="1" value="1" required>
      <span class="hint">Number of items you want</span>
    </label>

    <p class="total-price" id="total-text"></p>

    <!-- PAYMENT -->
    <div class="payment-box">
      <h3>💸 Payment</h3>
      <p>Please scan the QR code below and upload your payment slip.</p>

      <img
        src="https://raw.githubusercontent.com/apiwishboon-spec/march-shop-frontend/refs/heads/main/QR_payment.jpg"
        width="290"
        alt="Payment QR"
      >

      <br><br>

      <button class="btn-secondary" onclick="downloadQR()">
        Download QR Code
      </button>
    </div>

    <!-- SLIP UPLOAD -->
    <label class="label">
      Upload payment slip
      <input
        id="slip"
        type="file"
        accept="image/png, image/jpeg"
        required
      >
      <span class="hint">Max 5MB • JPG or PNG</span>
    </label>
    <!-- TURNSTILE -->
    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAACd8YswS-VO9XLfe"
         data-callback="onTurnstileSuccess">
    </div>

    <!-- BUTTONS -->
    <div class="button-row">
      <button class="btn-secondary" onclick="cancelOrder()">Cancel</button>

      <button
        class="btn-primary"
        id="submitBtn"
        onclick="submitOrder()"
        disabled>
        Submit order
      </button>
    </div>

  </div>

  <script src="app.js"></script>

  <script>
    const item = localStorage.getItem("item");
    const price = parseFloat(localStorage.getItem("price"));

    if (!item || !price) {
      location.href = "index.html";
    }

    const itemText = document.getElementById("item-text");
    const totalText = document.getElementById("total-text");
    const qtyInput = document.getElementById("qty");

    function formatCurrency(num) {
      return num.toLocaleString("en-US");
    }

    function updatePrice() {
      const qty = parseInt(qtyInput.value) || 1;
      if (qty < 1) qtyInput.value = 1;

      const total = price * qty;

      itemText.textContent = `${item} — ฿${formatCurrency(price)} each`;
      totalText.textContent = `Total: ฿${formatCurrency(total)}`;
    }

    qtyInput.addEventListener("input", updatePrice);
    updatePrice();

    function cancelOrder() {
      localStorage.clear();
      location.href = "index.html";
    }

    function downloadQR() {
      const link = document.createElement("a");
      link.href = "https://i.postimg.cc/ysnZqCgX/LINE-20260211-200132.jpg?dl=1";
      link.download = "ArtInk_Payment_QR.jpg";
      link.click();
    }
  </script>

</body>
</html>
