<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ART&INK Shop - Order - ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <div class="container">
    <!-- Animated Navigation -->
    <div class="nav-container">
      <div class="bars"></div>
    </div>

    <nav>
      <h2>ART&INK</h2>
      <div class="close">
        <div></div>
      </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="story.html">Our Story</a></li>
        <li><a href="faq.html">FQA</a></li>
      </ul>
    </nav>

    <!-- Simple Step Indicator -->
    <div class="step-indicator">
      <div class="step active" id="step1-indicator">
        <div class="step-dot">📝</div>
        <div class="step-label">order</div>
        <div class="step-description">Your details</div>
      </div>
      <div class="step" id="step2-indicator">
        <div class="step-dot">💸</div>
        <div class="step-label">payment</div>
        <div class="step-description">Your details</div>
      </div>
    </div>

    <main>
      <!-- Step 1: Order Details -->
      <div class="step-content active" id="step1">
        <div class="form-card">
          <h2>📋 Order Details</h2>
          
          <div class="order-summary">
            <div class="summary-item">
              <span class="label">Product:</span>
              <span class="value" id="summary-product">-</span>
            </div>
            <div class="summary-item">
              <span class="label">Price:</span>
              <span class="value">฿<span id="summary-price">-</span></span>
            </div>
            <div class="summary-item">
              <span class="label">Size:</span>
              <span class="value" id="summary-size">M</span>
            </div>
            <div class="summary-item">
              <span class="label">Selected Size:</span>
              <div class="size-selector">
                <div class="size-options">
                  <button type="button" class="size-btn" data-size="S" onclick="selectOrderSize('S')">S</button>
                  <button type="button" class="size-btn" data-size="M" onclick="selectOrderSize('M')">M</button>
                  <button type="button" class="size-btn" data-size="L" onclick="selectOrderSize('L')">L</button>
                  <button type="button" class="size-btn" data-size="XL" onclick="selectOrderSize('XL')">XL</button>
                </div>
              </div>
            </div>
            <div class="summary-item total-row">
              <span class="label">Total:</span>
              <span class="value total-price">฿<span id="summary-total">-</span></span>
            </div>
          </div>

          <form id="orderForm">
            <label class="label">
              Email
              <input id="email" type="email" placeholder="your@email.com" required>
            </label>

            <label class="label">
              Phone
              <input id="phone" type="tel" placeholder="xxx-xxx-xxxx" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            </label>

            <label class="label">
              Quantity
              <input id="qty" type="number" min="1" max="5" value="1" required>
              <span class="hint">Maximum 5 items per order (spam protection)</span>
            </label>

            <div class="button-row">
              <button type="button" class="btn-secondary" onclick="cancelOrder()">
                Cancel
              </button>
              <button type="button" class="btn-primary" onclick="goToStep2()">
                Next →
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Step 2: Payment -->
      <div class="step-content" id="step2">
        <div class="form-card">
          <h2>Payment</h2>
          
          <div class="payment-methods">
            <div class="payment-option">
              <input type="radio" id="promptpay" name="paymentMethod" value="promptpay" checked>
              <label for="promptpay" class="payment-label">
                <div class="payment-icon">📱</div>
                <div class="payment-info">
                  <strong>PromptPay QR</strong>
                  <span>Scan QR code with mobile banking app</span>
                </div>
              </label>
            </div>
          </div>

          <div id="promptpay-section">
            <div class="qr-section">
              <div class="qr-card">
                <img id="dynamicQR" src="" alt="Payment QR Code">
                <div class="qr-info">
                  <h3>📸 Scan QR Code</h3>
                  <p>Use your mobile banking app to scan this QR code and complete the payment.</p>
                  <!-- QR timer is injected dynamically by app.js -->
                </div>
              </div>
            </div>

          <label class="label" id="slipLabel">
            Upload payment slip
            <input id="slip" type="file" accept="image/png, image/jpeg" required>
            <span class="hint">Max 5MB • JPG or PNG</span>
          </label>

          <!-- Cloudflare Turnstile -->
          <div class="cf-turnstile"
               data-sitekey="0x4AAAAAACd8YswS-VO9XLfe"
               data-callback="onTurnstileSuccess">
          </div>

          <div class="button-row">
            <button type="button" class="btn-secondary" onclick="cancelOrder()">
              Cancel Order
            </button>
            <button type="button" class="btn-secondary" onclick="goToStep1()">
              ← Back
            </button>
            <button type="button" class="btn-primary" id="submitBtn" onclick="submitOrder()">
              <span class="btn-text">Submit Order</span>
            </button>
          </div>
        </div>
      </div>
      </div><!-- /#promptpay-section -->
    </main>
  </div>

  <!-- Blur Overlay with Loader -->
  <div class="blur-overlay" id="blurOverlay">
    <div class="loader"></div>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="app.js"></script>

  <!-- Footer -->
  <footer class="page-footer">
    <span class="copyright">© 2026 ART&INK</span>
    <a href="#" onclick="openPrivacy(); return false;">Privacy Policy</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="copyright.js"></script>
</body>
</html>
