<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art&Ink Studio – Order</title>
  <link rel="stylesheet" href="style.css">

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <!-- Your JS -->
  <script src="app.js" defer></script>
</head>

<body>
  <div class="container">

    <h1 class="brand">
      <span class="brand-gradient">Art&Ink Studio</span>
    </h1>

    <p class="subtitle" id="item-text"></p>
    <div id="error" class="error" style="display:none;color:red;"></div>

    <label class="label">
      Email address
      <input id="email" type="email" required>
    </label>

    <label class="label">
      Phone number
      <input id="phone" type="tel">
    </label>

    <label class="label">
      Quantity
      <input id="qty" type="number" min="1" value="1" required onchange="updateQR()">
      <span class="hint">Number of items you want</span>
    </label>

    <!-- PAYMENT -->
    <div class="payment-box">
      <h3>💸 Payment</h3>
      <p>Scan the QR below to pay.</p>

      <div style="margin-top:15px;">
        <img id="dynamicQR" width="290">
      </div>

      <p><strong id="qrTotal"></strong></p>

      <!-- DOWNLOAD BUTTON -->
      <button type="button" class="btn-secondary" onclick="downloadQR()" style="margin-top:10px;">
        Download QR
      </button>
    </div>

    <label class="label">
      Upload payment slip
      <input id="slip" type="file" accept="image/png, image/jpeg" required>
      <span class="hint">Max 5MB • JPG or PNG</span>
    </label>

    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAACd8YswS-VO9XLfe"
         data-callback="onTurnstileSuccess">
    </div>

    <div class="button-row">
      <button type="button" class="btn-secondary" onclick="cancelOrder()">Cancel</button>
      <button type="button" class="btn-primary" id="submitBtn">
        Submit order
      </button>

    </div>

  </div>

<script>
const basePrice = 299; // change to your real price

// SHOW QR WHEN PAGE LOADS
window.onload = function() {
  updateQR();
};

function updateQR() {
  const qty = document.getElementById("qty").value;
  const total = basePrice * qty;

  // Example QR generator (replace with your real promptpay or QR link)
  const qrURL = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=PAYMENT-" + total;

  document.getElementById("dynamicQR").src = qrURL;
  document.getElementById("qrTotal").innerText = "Total: ฿" + total;
}

// DOWNLOAD FUNCTION
function downloadQR() {
  const qrImage = document.getElementById("dynamicQR").src;

  const link = document.createElement("a");
  link.href = qrImage;
  link.download = "ArtInkStudio-QR.png";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

</body>
</html>
