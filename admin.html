<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-black text-white">
  <div id="root"></div>

  <script>
    const { useState, useEffect } = React;
    const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = Recharts;
    const { ShoppingBag, CreditCard, Package, Users, TrendingUp } = lucide;

    const categoryData = [
      { name: 'Electronics', value: 4500, color: '#3b82f6' },
      { name: 'Fashion', value: 3200, color: '#10b981' },
      { name: 'Home & Kitchen', value: 2100, color: '#f59e0b' },
      { name: 'Beauty', value: 1500, color: '#f43f5e' },
    ];

    const salesData = [
      { day: 'Mon', sales: 4000 },
      { day: 'Tue', sales: 3000 },
      { day: 'Wed', sales: 2000 },
      { day: 'Thu', sales: 2780 },
      { day: 'Fri', sales: 1890 },
      { day: 'Sat', sales: 2390 },
      { day: 'Sun', sales: 3490 },
    ];

    function EcommerceDashboard() {
      const [orders, setOrders] = useState(1284);
      const [revenue, setRevenue] = useState(42930);
      const [productsSold, setProductsSold] = useState(5432);
      const [newCustomers, setNewCustomers] = useState(342);
      const [subscribers, setSubscribers] = useState(0);

      useEffect(() => {
        // Load data from Google Sheets
        fetch('YOUR_GOOGLE_SCRIPT_URL?action=adminData')
          .then(response => response.json())
          .then(data => {
            if (data.orders) setOrders(data.orders);
            if (data.revenue) setRevenue(data.revenue);
            if (data.productsSold) setProductsSold(data.productsSold);
            if (data.newCustomers) setNewCustomers(data.newCustomers);
            if (data.subscribers) setSubscribers(data.subscribers);
          });
      }, []);

      const sendNewsletter = () => {
        fetch('YOUR_GOOGLE_SCRIPT_URL?action=sendNewsletter', {
          method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('Newsletter sent successfully!');
          }
        });
      };

      return React.createElement('div', { className: "min-h-screen bg-black text-white p-8 pt-32" }, [
        React.createElement('div', { className: "max-w-7xl mx-auto" }, [
          React.createElement('div', { className: "flex justify-between items-end mb-10" }, [
            React.createElement('div', null, [
              React.createElement('h1', { className: "text-4xl font-bold mb-2" }, "E-commerce Sales"),
              React.createElement('p', { className: "text-zinc-400" }, "Real-time overview of your store performance.")
            ]),
            React.createElement('div', { className: "flex gap-4" }, [
              React.createElement('button', { className: "bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors" }, "7 Days"),
              React.createElement('button', { className: "bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors" }, "30 Days")
            ])
          ]),

          React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10" }, [
            React.createElement('div', { className: "bg-zinc-900 border border-zinc-800 p-6 rounded-2xl" }, [
              React.createElement('div', { className: "flex items-center gap-4 mb-4" }, [
                React.createElement('div', { className: "w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center" }, 
                  React.createElement(ShoppingBag, { className: "w-5 h-5 text-blue-500" })
                ),
                React.createElement('p', { className: "text-zinc-400 text-sm" }, "Total Orders")
              ]),
              React.createElement('h3', { className: "text-2xl font-bold" }, orders.toLocaleString()),
              React.createElement('p', { className: "text-emerald-500 text-xs mt-2" }, "+14% from last week")
            ]),
            React.createElement('div', { className: "bg-zinc-900 border border-zinc-800 p-6 rounded-2xl" }, [
              React.createElement('div', { className: "flex items-center gap-4 mb-4" }, [
                React.createElement('div', { className: "w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center" }, 
                  React.createElement(CreditCard, { className: "w-5 h-5 text-emerald-500" })
                ),
                React.createElement('p', { className: "text-zinc-400 text-sm" }, "Revenue")
              ]),
              React.createElement('h3', { className: "text-2xl font-bold" }, `$${revenue.toLocaleString()}`),
              React.createElement('p', { className: "text-emerald-500 text-xs mt-2" }, "+8% from last week")
            ]),
            React.createElement('div', { className: "bg-zinc-900 border border-zinc-800 p-6 rounded-2xl" }, [
              React.createElement('div', { className: "flex items-center gap-4 mb-4" }, [
                React.createElement('div', { className: "w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center" }, 
                  React.createElement(Package, { className: "w-5 h-5 text-amber-500" })
                ),
                React.createElement('p', { className: "text-zinc-400 text-sm" }, "Products Sold")
              ]),
              React.createElement('h3', { className: "text-2xl font-bold" }, productsSold.toLocaleString()),
              React.createElement('p', { className: "text-rose-500 text-xs mt-2" }, "-2% from last week")
            ]),
            React.createElement('div', { className: "bg-zinc-900 border border-zinc-800 p-6 rounded-2xl" }, [
              React.createElement('div', { className: "flex items-center gap-4 mb-4" }, [
                React.createElement('div', { className: "w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center" }, 
                  React.createElement(Users, { className: "w-5 h-5 text-purple-500" })
                ),
                React.createElement('p', { className: "text-zinc-400 text-sm" }, "New Customers")
              ]),
              React.createElement('h3', { className: "text-2xl font-bold" }, newCustomers.toLocaleString()),
              React.createElement('p', { className: "text-emerald-500 text-xs mt-2" }, "+22% from last week")
            ])
          ]),

          React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-3 gap-8" }, [
            React.createElement('div', { className: "lg:col-span-2 bg-zinc-900 border border-zinc-800 p-6 rounded-2xl" }, [
              React.createElement('h3', { className: "text-xl font-bold mb-6" }, "Daily Sales Trend"),
              React.createElement('div', { className: "h-[350px] w-full" }, 
                React.createElement(ResponsiveContainer, { width: "100%", height: "100%" }, 
                  React.createElement(BarChart, { data: salesData }, [
                    React.createElement(CartesianGrid, { strokeDasharray: "3 3", stroke: "#27272a", vertical: false }),
                    React.createElement(XAxis, { dataKey: "day", stroke: "#71717a" }),
                    React.createElement(YAxis, { stroke: "#71717a" }),
                    React.createElement(Tooltip, { 
                      contentStyle: { backgroundColor: '#18181b', border: '1px solid #27272a', borderRadius: '8px' } 
                    }),
                    React.createElement(Bar, { dataKey: "sales", fill: "#3b82f6", radius: [4, 4, 0, 0] })
                  ])
                )
              )
            ]),

            React.createElement('div', { className: "bg-zinc-900 border border-zinc-800 p-6 rounded-2xl" }, [
              React.createElement('h3', { className: "text-xl font-bold mb-6" }, "Sales by Category"),
              React.createElement('div', { className: "h-[350px] w-full" }, 
                React.createElement(ResponsiveContainer, { width: "100%", height: "100%" }, 
                  React.createElement(PieChart, null, 
                    React.createElement(Pie, {
                      data: categoryData,
                      cx: "50%",
                      cy: "50%",
                      innerRadius: 60,
                      outerRadius: 100,
                      paddingAngle: 5,
                      dataKey: "value"
                    }, 
                      categoryData.map((entry, index) => 
                        React.createElement(Cell, { key: `cell-${index}`, fill: entry.color })
                      )
                    ),
                    React.createElement(Tooltip, { 
                      contentStyle: { backgroundColor: '#18181b', border: '1px solid #27272a', borderRadius: '8px' } 
                    }),
                    React.createElement(Legend)
                  )
                )
              )
            ])
          ]),

          React.createElement('div', { className: "bg-zinc-900 border border-zinc-800 p-6 rounded-2xl mb-8" }, [
            React.createElement('h3', { className: "text-xl font-bold mb-4" }, "Newsletter Subscribers"),
            React.createElement('div', { className: "flex items-center justify-between" }, [
              React.createElement('div', null, [
                React.createElement('p', { className: "text-3xl font-bold" }, subscribers.toLocaleString()),
                React.createElement('p', { className: "text-zinc-400" }, "Total subscribers")
              ]),
              React.createElement('button', { 
                onClick: sendNewsletter,
                className: "bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-medium transition-colors" 
              }, "Send Newsletter")
            ])
          ])
        ])
      ]);
    }

    ReactDOM.render(React.createElement(EcommerceDashboard), document.getElementById('root'));
  </script>
</body>
</html>
