<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-dashboard">
  <div class="admin-container">
    <header class="admin-header">
      <h1>🎨 ART&INK Admin Dashboard</h1>
      <div class="admin-nav">
        <button onclick="loadData()" class="admin-nav-btn active">Dashboard</button>
        <button onclick="sendNewsletter()" class="admin-nav-btn">Send Newsletter</button>
      </div>
    </header>

    <main class="admin-main">
      <!-- Stats Cards -->
      <section class="stats-section">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">🛍️</div>
            <div class="stat-content">
              <h3 id="total-orders">0</h3>
              <p>Total Orders</p>
              <span class="stat-change positive">+14%</span>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-icon">💳</div>
            <div class="stat-content">
              <h3 id="total-revenue">฿0</h3>
              <p>Total Revenue</p>
              <span class="stat-change positive">+8%</span>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-icon">📦</div>
            <div class="stat-content">
              <h3 id="products-sold">0</h3>
              <p>Products Sold</p>
              <span class="stat-change negative">-2%</span>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-content">
              <h3 id="new-customers">0</h3>
              <p>New Customers</p>
              <span class="stat-change positive">+22%</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Charts Section -->
      <section class="charts-section">
        <div class="charts-grid">
          <div class="chart-card">
            <h3>Daily Sales Trend</h3>
            <div class="chart-container">
              <canvas id="salesChart"></canvas>
            </div>
          </div>
          
          <div class="chart-card">
            <h3>Sales by Category</h3>
            <div class="chart-container">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>
      </section>

      <!-- Newsletter Section -->
      <section class="newsletter-section">
        <div class="newsletter-card">
          <h3>Newsletter Subscribers</h3>
          <div class="newsletter-stats">
            <div class="subscriber-count">
              <span id="subscriber-count">0</span>
              <p>Total Subscribers</p>
            </div>
            <button onclick="sendNewsletter()" class="newsletter-send-btn">
              📧 Send Newsletter
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Check if already authenticated
    const isAuthenticated = sessionStorage.getItem('adminAuth');
    
    if (!isAuthenticated) {
      // Check if password is in URL
      const urlParams = new URLSearchParams(window.location.search);
      const password = urlParams.get('password');
      
      if (password) {
        // Validate password with backend
        validatePassword(password);
      } else {
        // Prompt for password
        const enteredPassword = prompt('Enter admin password:');
        if (enteredPassword) {
          validatePassword(enteredPassword);
        } else {
          alert('Password required');
          window.location.href = 'index.html';
        }
      }
    }

    function validatePassword(password) {
      const API_URL = "https://script.google.com/macros/s/AKfycbxENBG6cKm3ImJd_6gjvxCUnM-hG0xeNhPhjLUleDCyh0JsXhkkG7wOwkBjRW43j-88mg/exec";
      
      const formData = new URLSearchParams();
      formData.append('password', password);
      formData.append('action', 'adminLogin');
      
      fetch(API_URL, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          sessionStorage.setItem('adminAuth', 'true');
          // Remove password from URL if present
          if (window.location.search.includes('password=')) {
            window.location.href = 'admin.html';
          } else {
            loadData(); // Load dashboard data
          }
        } else {
          alert('Invalid password');
          window.location.href = 'index.html';
        }
      })
      .catch(error => {
        console.error('Authentication error:', error);
        alert('Authentication failed');
        window.location.href = 'index.html';
      });
    }

    // Load dashboard data
    function loadData() {
      fetch(API_URL + '?action=adminData')
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            updateStats(data.data);
            updateCharts(data.data);
          } else {
            // Use fallback data if backend fails
            useFallbackData();
          }
        })
        .catch(error => {
          console.error('Error loading data:', error);
          // Use fallback data on error
          useFallbackData();
        });
    }

    // Fallback data for testing
    function useFallbackData() {
      const fallbackData = {
        orders: 1284,
        revenue: 42930,
        productsSold: 5432,
        newCustomers: 342,
        subscribers: 156
      };
      
      updateStats(fallbackData);
      updateCharts(fallbackData);
      
      console.log('Using fallback data - backend not deployed yet');
    }

    // Update stats display
    function updateStats(data) {
      document.getElementById('total-orders').textContent = data.orders.toLocaleString();
      document.getElementById('total-revenue').textContent = '฿' + data.revenue.toLocaleString();
      document.getElementById('products-sold').textContent = data.productsSold.toLocaleString();
      document.getElementById('new-customers').textContent = data.newCustomers.toLocaleString();
      document.getElementById('subscriber-count').textContent = data.subscribers.toLocaleString();
    }

    // Update charts
    function updateCharts(data) {
      // Sales Chart
      const salesCtx = document.getElementById('salesChart').getContext('2d');
      new Chart(salesCtx, {
        type: 'bar',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{
            label: 'Sales',
            data: [4000, 3000, 2000, 2780, 1890, 2390, 3490],
            backgroundColor: '#3b82f6',
            borderColor: '#3b82f6',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: '#374151'
              },
              ticks: {
                color: '#9ca3af'
              }
            },
            x: {
              grid: {
                display: false
              },
              ticks: {
                color: '#9ca3af'
              }
            }
          }
        }
      });

      // Category Chart
      const categoryCtx = document.getElementById('categoryChart').getContext('2d');
      new Chart(categoryCtx, {
        type: 'pie',
        data: {
          labels: ['Fashion', 'Electronics', 'Home & Kitchen', 'Beauty'],
          datasets: [{
            data: [3200, 4500, 2100, 1500],
            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#f43f5e'],
            borderWidth: 2,
            borderColor: '#111827'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#9ca3af',
                padding: 20
              }
            }
          }
        }
      });
    }

    // Send newsletter
    function sendNewsletter() {
      if (confirm('Send newsletter to all subscribers?')) {
        fetch(API_URL + '?action=sendNewsletter', {
          method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('Newsletter sent successfully to ' + data.sentTo + ' subscribers!');
          } else {
            alert('Failed to send newsletter: ' + data.message);
          }
        })
        .catch(error => {
          console.error('Error sending newsletter:', error);
          alert('Error sending newsletter');
        });
      }
    }

    // Load data on page load
    loadData();
  </script>
</body>
</html>
