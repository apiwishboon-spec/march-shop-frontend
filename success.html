<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Placed – ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #eff6ff 60%, #f5f3ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .success-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(243, 166, 200, .3);
      border-radius: 28px;
      padding: 52px 44px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(243, 166, 200, .2), 0 4px 20px rgba(0, 0, 0, .08);
      animation: riseIn .6s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: scale(.88) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f3a6c8, #d9b7ee);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 24px;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(243, 166, 200, .4);
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 8px 24px rgba(243, 166, 200, .4);
      }

      50% {
        transform: scale(1.06);
        box-shadow: 0 12px 32px rgba(243, 166, 200, .6);
      }
    }

    .success-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #111827;
      letter-spacing: -.5px;
      margin-bottom: 8px;
    }

    .success-sub {
      color: #6b7280;
      font-size: .92rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .order-box {
      background: linear-gradient(135deg, #fdf2f8, #eff6ff);
      border: 1.5px solid rgba(243, 166, 200, .4);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }

    .order-box-label {
      font-size: .72rem;
      font-weight: 700;
      color: #9d5b7b;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    .order-code {
      font-size: 1.5rem;
      font-weight: 900;
      color: #111827;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .success-steps {
      text-align: left;
      background: #f9fafb;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 28px;
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .step-row:last-child {
      border-bottom: none;
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f3a6c8, #d9b7ee);
      color: #111;
      font-size: .75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-text {
      font-size: .85rem;
      color: #374151;
      font-weight: 500;
    }

    .btn-home {
      display: block;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background .2s, transform .15s;
      text-decoration: none;
      text-align: center;
    }

    .btn-home:hover {
      background: #374151;
      transform: translateY(-1px);
    }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      
      .success-card {
        padding: 40px 24px;
        border-radius: 20px;
      }
      
      .success-icon {
        font-size: 4rem;
        margin-bottom: 20px;
      }
      
      .success-title {
        font-size: 2rem;
        margin-bottom: 16px;
      }
      
      .success-sub {
        font-size: 1rem;
        margin-bottom: 24px;
      }
      
      .order-box {
        margin-bottom: 24px;
      }
      
      .order-box-label {
        font-size: 1.1rem;
        margin-bottom: 12px;
      }
      
      .order-code {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      
      .success-steps {
        margin-bottom: 28px;
      }
      
      .step-row {
        padding: 8px 0;
      }
      
      .step-num {
        width: 26px;
        height: 26px;
        font-size: .75rem;
      }
      
      .step-text {
        font-size: .85rem;
      }
      
      .btn-home {
        padding: 14px 24px;
        font-size: 0.95rem;
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      
      .success-card {
        padding: 32px 20px;
        border-radius: 16px;
      }
      
      .success-icon {
        font-size: 3.5rem;
        margin-bottom: 16px;
      }
      
      .success-title {
        font-size: 1.6rem;
        margin-bottom: 12px;
      }
      
      .success-sub {
        font-size: 0.95rem;
        margin-bottom: 20px;
      }
      
      .order-box {
        margin-bottom: 20px;
      }
      
      .order-box-label {
        font-size: 1rem;
        margin-bottom: 10px;
      }
      
      .order-code {
        font-size: 1.5rem;
        margin-bottom: 6px;
      }
      
      .success-steps {
        margin-bottom: 24px;
      }
      
      .step-row {
        padding: 8px 0;
      }
      
      .step-num {
        width: 26px;
        height: 26px;
        font-size: .75rem;
      }
      
      .step-text {
        font-size: .85rem;
      }
      
      .btn-home {
        padding: 12px 20px;
        font-size: 0.9rem;
      }
    }

    /* Navigation Bar */
    .nav-bar {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 0;
      width: 100%;
      left: 0;
      right: 0;
    }

    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .nav-brand a {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #f8a5c2, #87cefa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .nav-brand a:hover {
      transform: translateY(-1px);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav-links a {
      color: #666;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: #f8a5c2;
    }

    .nav-links a.active {
      color: #f8a5c2;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(135deg, #f8a5c2, #87cefa);
      border-radius: 1px;
    }

    .nav-footer {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
      color: #666;
    }

    .nav-footer .copyright {
      color: #666;
      font-weight: 500;
    }

    .nav-footer a {
      color: #666;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-footer a:hover {
      color: #f8a5c2;
    }

    @media (max-width: 768px) {
      .nav-content {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .nav-links {
        gap: 20px;
      }

      .nav-footer {
        font-size: 12px;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-brand a {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <div class="nav-content">
        <div class="nav-brand">
          <a href="index.html">ART&INK</a>
        </div>
        <div class="nav-links">
          <a href="index.html">Home</a>
        </div>
        <div class="nav-footer">
          <span class="copyright">© 2026 ART&INK</span>
          <a href="#" onclick="openPrivacy(); return false;">Privacy Policy</a>
        </div>
      </div>
    </nav>

  <canvas id="confetti"></canvas>

  <div class="success-card">
    <div class="success-icon">🎉</div>

    <h1 class="success-title">Order Placed!</h1>
    <p class="success-sub">
      Your order has been submitted successfully.<br>
      Check your email for confirmation and updates.
    </p>

    <div class="order-box">
      <div class="order-box-label">Your Order Code</div>
      <div class="order-code" id="code">—</div>
    </div>

    <div class="success-steps">
      <div class="step-row">
        <div class="step-num">1</div>
        <div class="step-text">Order received &amp; logged ✓</div>
      </div>
      <div class="step-row">
        <div class="step-num">2</div>
        <div class="step-text">We verify your payment slip</div>
      </div>
      <div class="step-row">
        <div class="step-num">3</div>
        <div class="step-text">Your shirt is printed &amp; shipped</div>
      </div>
    </div>

    <a href="index.html" class="btn-home">🛍️ Continue Shopping</a>
  </div>

  <script>
    // Show order ID
    const urlParams = new URLSearchParams(window.location.search);
    let orderId = urlParams.get('id') || localStorage.getItem('lastOrderId') || 'ART-' + Date.now();
    localStorage.setItem('lastOrderId', orderId);
    document.getElementById('code').textContent = orderId;

    // Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#f3a6c8', '#d9b7ee', '#9ecbff', '#fde68a', '#a7f3d0'];
    const pieces = [];

    for (let i = 0; i < 140; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height - 20,
        r: Math.random() * 7 + 3,
        dY: Math.random() * 2.5 + 1.5,
        dX: (Math.random() - 0.5) * 2.5,
        rot: Math.random() * 360,
        dRot: (Math.random() - 0.5) * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: Math.random() > .5 ? 'circle' : 'rect'
      });
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach((p, i) => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r);
        }
        ctx.restore();
        p.y += p.dY;
        p.x += p.dX;
        p.rot += p.dRot;
        if (p.y > canvas.height + 20) pieces.splice(i, 1);
      });
      if (pieces.length > 0) requestAnimationFrame(drawConfetti);
    }

    drawConfetti();
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

<script src="copyright.js"></script>
</body>

</html>
