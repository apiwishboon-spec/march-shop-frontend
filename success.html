<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ART&INK – Success</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </svg>
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
    </svg>
  </button>

  <canvas id="confetti"></canvas>

  <div class="container center success-container">

    <h1 class="brand">
      <span class="brand-gradient">Order submitted 🎉</span>
    </h1>

    <p class="subtitle">Check your email for order status</p>

    <div class="card glow-box">
      <div class="small">Order code</div>
      <div id="code" class="order-code"></div>
    </div>

    <br>

    <div class="button-row">
      <button class="btn-outline" onclick="location.href='index.html'">
        Continue shopping
      </button>
      <button class="btn-primary" onclick="viewReceipt()">
        <i data-lucide="receipt" style="width: 16px; height: 16px; margin-right: 8px;"></i>
        View Receipt
      </button>
      <button class="btn-secondary" onclick="downloadSlip()">
        <i data-lucide="download" style="width: 16px; height: 16px; margin-right: 8px;"></i>
        Download Slip
      </button>
    </div>
  </div>

  <script>
    // Get order code from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id') || 'ORD-' + Date.now();
    document.getElementById("code").textContent = orderId;
    
    // Initialize Lucide icons
    lucide.createIcons();
    
    // View Receipt function
    function viewReceipt() {
      const email = localStorage.getItem('receipt-email') || 'customer@artink.com';
      const item = localStorage.getItem('receipt-item') || 'ART&INK Product';
      const quantity = localStorage.getItem('receipt-qty') || '1';
      const total = localStorage.getItem('receipt-total') || '฿590';
      const date = new Date().toLocaleString();
      
      // Open professional slip page
      const slipUrl = `slip.html?id=${orderId}&email=${encodeURIComponent(email)}&item=${encodeURIComponent(item)}&qty=${quantity}&total=${encodeURIComponent(total)}&date=${encodeURIComponent(date)}`;
      window.open(slipUrl, '_blank', 'width=800,height=900,scrollbars=yes,resizable=yes');
    }
    
    // Download Slip function
    function downloadSlip() {
      const email = localStorage.getItem('receipt-email') || 'customer@artink.com';
      const item = localStorage.getItem('receipt-item') || 'ART&INK Product';
      const quantity = localStorage.getItem('receipt-qty') || '1';
      const total = localStorage.getItem('receipt-total') || '฿590';
      const date = new Date().toLocaleString();
      
      // Create download link for slip
      const slipUrl = `slip.html?id=${orderId}&email=${encodeURIComponent(email)}&item=${encodeURIComponent(item)}&qty=${quantity}&total=${encodeURIComponent(total)}&date=${encodeURIComponent(date)}`;
      window.open(slipUrl, '_blank');
    }
    
    // Dark mode functionality with local time adaptation
    function toggleTheme() {
      const html = document.documentElement;
      const sunIcon = document.querySelector('.sun-icon');
      const moonIcon = document.querySelector('.moon-icon');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
        localStorage.setItem('theme', 'dark');
      }
    }
    
    // Check for saved theme preference and local time
    function initTheme() {
      const hour = new Date().getHours();
      const isNightTime = hour >= 18 || hour < 6; // 6 PM to 6 AM
      const savedTheme = localStorage.getItem('theme');
      
      // Auto-enable dark mode during night hours if no preference saved
      if (savedTheme === 'dark' || (!savedTheme && isNightTime)) {
        document.documentElement.classList.add('dark');
        document.querySelector('.sun-icon').style.display = 'none';
        document.querySelector('.moon-icon').style.display = 'block';
      }
    }
    
    // Initialize theme on page load
    initTheme();
  </script>
  
  <script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#f3a6c8", "#d9b7ee", "#9ecbff", "#fde68a"];
  const pieces = [];

  function createConfetti() {
    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: Math.random() * 6 + 4,
        dY: Math.random() * 3 + 2,
        dX: (Math.random() - 0.5) * 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 200
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach((p, i) => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      p.y += p.dY;
      p.x += p.dX;
      p.life--;

      if (p.life <= 0) pieces.splice(i, 1);
    });

    if (pieces.length > 0) {
      requestAnimationFrame(draw);
    }
  }

  // 🎉 launch sequence
  createConfetti();
  draw();

  // resize safety
  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
