<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ART&INK – Success</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 2px solid var(--border-primary);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 2px 10px var(--shadow-light);
    }
    
    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 20px var(--shadow-medium);
    }
    
    .dark .theme-toggle {
      background: var(--bg-tertiary);
      border-color: var(--border-primary);
    }
    
    .theme-toggle svg {
      width: 24px;
      height: 24px;
      color: var(--text-primary);
    }
  </style>
</head>

<body>
  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </svg>
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
    </svg>
  </button>

  <canvas id="confetti"></canvas>

  <div class="container center success-container">

    <h1 class="brand">
      <span class="brand-gradient">Order submitted 🎉</span>
    </h1>

    <p class="subtitle">Check your email for order status</p>

    <div class="card glow-box">
      <div class="small">Order code</div>
      <div id="code" class="order-code"></div>
    </div>

    <br>

    <div class="button-row">
      <button class="btn-outline" onclick="location.href='index.html'">
        Continue shopping
      </button>
      <button class="btn-primary" onclick="viewReceipt()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; margin-right: 8px; vertical-align: middle;">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
          <path d="M16 8H8a2 2 0 0 0-2-2v4a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
        </svg>
        View Receipt
      </button>
      <button class="btn-secondary" onclick="downloadSlip()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; margin-right: 8px; vertical-align: middle;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15"/>
        </svg>
        Download Slip
      </button>
    </div>
  </div>

  <script>
    // Get order code from URL parameters with fallback
    const urlParams = new URLSearchParams(window.location.search);
    let orderId = urlParams.get('id');
    
    // If no ID in URL, try to get from localStorage or generate one
    if (!orderId) {
      orderId = localStorage.getItem('lastOrderId') || 'ORD-' + Date.now();
    }
    
    // Save to localStorage for receipt functions
    localStorage.setItem('lastOrderId', orderId);
    
    // Set the order code display
    document.getElementById("code").textContent = orderId;
    
    // Initialize theme
    function toggleTheme() {
      const html = document.documentElement;
      const sunIcon = document.querySelector('.sun-icon');
      const moonIcon = document.querySelector('.moon-icon');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
        localStorage.setItem('theme', 'dark');
      }
    }
    
    // Initialize theme on page load
    function initTheme() {
      const hour = new Date().getHours();
      const isNightTime = hour >= 18 || hour < 6;
      const savedTheme = localStorage.getItem('theme');
      
      if (savedTheme === 'dark' || (!savedTheme && isNightTime)) {
        document.documentElement.classList.add('dark');
        document.querySelector('.sun-icon').style.display = 'none';
        document.querySelector('.moon-icon').style.display = 'block';
      }
    }
    
    // View Receipt function
    function viewReceipt() {
      const email = localStorage.getItem('receipt-email') || 'customer@artink.com';
      const item = localStorage.getItem('receipt-item') || 'ART&INK Product';
      const quantity = localStorage.getItem('receipt-qty') || '1';
      const total = localStorage.getItem('receipt-total') || '฿590';
      const date = new Date().toLocaleString();
      
      // Open professional slip page
      const slipUrl = `slip.html?id=${orderId}&email=${encodeURIComponent(email)}&item=${encodeURIComponent(item)}&qty=${quantity}&total=${encodeURIComponent(total)}&date=${encodeURIComponent(date)}`;
      window.open(slipUrl, '_blank', 'width=800,height=900,scrollbars=yes,resizable=yes');
    }
    
    // Download Slip function
    function downloadSlip() {
      const email = localStorage.getItem('receipt-email') || 'customer@artink.com';
      const item = localStorage.getItem('receipt-item') || 'ART&INK Product';
      const quantity = localStorage.getItem('receipt-qty') || '1';
      const total = localStorage.getItem('receipt-total') || '฿590';
      const date = new Date().toLocaleString();
      
      // Create download link for slip
      const slipUrl = `slip.html?id=${orderId}&email=${encodeURIComponent(email)}&item=${encodeURIComponent(item)}&qty=${quantity}&total=${encodeURIComponent(total)}&date=${encodeURIComponent(date)}`;
      window.open(slipUrl, '_blank');
    }
    
    // Initialize on page load
    initTheme();
  </script>
  
  <script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#f3a6c8", "#d9b7ee", "#9ecbff", "#fde68a"];
  const pieces = [];

  function createConfetti() {
    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: Math.random() * 6 + 4,
        dY: Math.random() * 3 + 2,
        dX: (Math.random() - 0.5) * 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 200
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach((p, i) => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      p.y += p.dY;
      p.x += p.dX;
      p.life--;

      if (p.life <= 0) pieces.splice(i, 1);
    });

    if (pieces.length > 0) {
      requestAnimationFrame(draw);
    }
  }

  // 🎉 launch sequence
  createConfetti();
  draw();

  // resize safety
  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
