<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ART&INK – Success</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="container center success-container">

    <h1 class="brand">
      <span class="brand-gradient">Order submitted ✓</span>
    </h1>

    <p class="subtitle">Check your email for order status</p>

    <div class="card glow-box">
      <div class="small">Order code</div>
      <div id="code" class="order-code"></div>
    </div>

    <br>

    <div class="button-row">
      <button class="btn-primary" onclick="location.href='index.html'">
        Continue Shopping
      </button>
    </div>
  </div>

  <script>
    // Make orderId globally accessible
    let orderId;
    
    // Get order code from URL parameters with fallback
    const urlParams = new URLSearchParams(window.location.search);
    orderId = urlParams.get('id');
    
    // If no ID in URL, try to get from localStorage or generate one
    if (!orderId) {
      orderId = localStorage.getItem('lastOrderId') || 'ORD-' + Date.now();
    }
    
    // Save to localStorage for receipt functions
    localStorage.setItem('lastOrderId', orderId);
    
    // Set the order code display
    document.getElementById("code").textContent = orderId;
    
    // Initialize on page load
  </script>
  
  <script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#f3a6c8", "#d9b7ee", "#9ecbff", "#fde68a"];
  const pieces = [];

  function createConfetti() {
    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: Math.random() * 6 + 4,
        dY: Math.random() * 3 + 2,
        dX: (Math.random() - 0.5) * 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 200
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach((p, i) => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      p.y += p.dY;
      p.x += p.dX;
      p.life--;

      if (p.life <= 0) pieces.splice(i, 1);
    });

    if (pieces.length > 0) {
      requestAnimationFrame(draw);
    }
  }

  // 🎉 launch sequence
  createConfetti();
  draw();

  // resize safety
  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
