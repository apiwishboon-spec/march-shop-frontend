<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ART&INK – Success</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <i data-lucide="sun" class="sun-icon"></i>
    <i data-lucide="moon" class="moon-icon" style="display:none;"></i>
  </button>

  <canvas id="confetti"></canvas>

  <div class="container center success-container">

    <h1 class="brand">
      <span class="brand-gradient">Order submitted 🎉</span>
    </h1>

    <p class="subtitle">Check your email for payment instructions</p>

    <div class="card glow-box">
      <div class="small">Order code</div>
      <div id="code" class="order-code"></div>
    </div>

    <br>

    <button class="btn-outline" onclick="location.href='index.html'">
      Continue shopping
    </button>
  </div>

  <script>
    document.getElementById("code").textContent =
      new URLSearchParams(location.search).get("id");
    
    // Initialize Lucide icons
    lucide.createIcons();
    
    // Dark mode functionality with local time adaptation
    function toggleTheme() {
      const html = document.documentElement;
      const sunIcon = document.querySelector('.sun-icon');
      const moonIcon = document.querySelector('.moon-icon');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
        localStorage.setItem('theme', 'dark');
      }
    }
    
    // Check for saved theme preference and local time
    function initTheme() {
      const hour = new Date().getHours();
      const isNightTime = hour >= 18 || hour < 6; // 6 PM to 6 AM
      const savedTheme = localStorage.getItem('theme');
      
      // Auto-enable dark mode during night hours if no preference saved
      if (savedTheme === 'dark' || (!savedTheme && isNightTime)) {
        document.documentElement.classList.add('dark');
        document.querySelector('.sun-icon').style.display = 'none';
        document.querySelector('.moon-icon').style.display = 'block';
      }
    }
    
    // Initialize theme on page load
    initTheme();
  </script>
  
  <script>
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#f3a6c8", "#d9b7ee", "#9ecbff", "#fde68a"];
  const pieces = [];

  function createConfetti() {
    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: Math.random() * 6 + 4,
        dY: Math.random() * 3 + 2,
        dX: (Math.random() - 0.5) * 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 200
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach((p, i) => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      p.y += p.dY;
      p.x += p.dX;
      p.life--;

      if (p.life <= 0) pieces.splice(i, 1);
    });

    if (pieces.length > 0) {
      requestAnimationFrame(draw);
    }
  }

  // 🎉 launch sequence
  createConfetti();
  draw();

  // resize safety
  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
