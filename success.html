<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <title>Order Placed – ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="success-page">
  <canvas id="confetti"></canvas>

  <div class="container">


    <div class="success-card">
      <div class="success-icon">🎉</div>

      <h1 class="success-title">Order Placed!</h1>
      <p class="success-sub">
        Your order has been submitted successfully.<br>
        Check your email for confirmation and updates.
      </p>

      <div class="order-box">
        <div class="order-box-label">Your Order Code</div>
        <div class="order-code" id="code">32094A85</div>
      </div>

      <div class="step-row">
        <div class="step-num">1</div>
        <div class="step-text">Order placed &amp; payment confirmed</div>
      </div>
      <div class="step-row">
        <div class="step-num">2</div>
        <div class="step-text">Your shirt is printed &amp; quality checked</div>
      </div>
      <div class="step-row">
        <div class="step-num">3</div>
        <div class="step-text">Your shirt is packed &amp; shipped</div>
      </div>

      <a href="index.html" class="btn-home">🛍️ Continue Shopping</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="app.js"></script>
  <script src="copyright.js"></script>
</body>

</html>
