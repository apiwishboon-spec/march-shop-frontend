<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* 404 Page Specific Styles */
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #f8a5c2 0%, #87cefa 100%);
      position: relative;
      overflow: hidden;
    }

    .error-content {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }

    .error-code {
      font-size: 120px;
      font-weight: 900;
      color: #f8a5c2;
      line-height: 1;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      animation: float 3s ease-in-out infinite;
    }

    .error-title {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .error-message {
      font-size: 18px;
      color: #666;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-home {
      background: linear-gradient(135deg, #f8a5c2, #87cefa);
      color: white;
      padding: 15px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(248, 165, 194, 0.3);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(248, 165, 194, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #f8a5c2;
      padding: 15px 30px;
      border: 2px solid #f8a5c2;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: #f8a5c2;
      color: white;
      transform: translateY(-2px);
    }

    .error-illustration {
      font-size: 80px;
      margin-bottom: 30px;
      animation: bounce 2s ease-in-out infinite;
    }

    /* Background decorations */
    .bg-decoration {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 6s ease-in-out infinite;
    }

    .bg-decoration:nth-child(1) {
      width: 200px;
      height: 200px;
      top: 10%;
      left: 5%;
      animation-delay: 0s;
    }

    .bg-decoration:nth-child(2) {
      width: 150px;
      height: 150px;
      top: 60%;
      right: 10%;
      animation-delay: 2s;
    }

    .bg-decoration:nth-child(3) {
      width: 100px;
      height: 100px;
      bottom: 20%;
      left: 15%;
      animation-delay: 4s;
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-30px); }
      60% { transform: translateY(-15px); }
    }

    /* Dark mode support */
    .dark .error-container {
      background: linear-gradient(135deg, #2d1b3d 0%, #1a3a52 100%);
    }

    .dark .error-content {
      background: rgba(30, 30, 30, 0.95);
      color: #fff;
    }

    .dark .error-title {
      color: #fff;
    }

    .dark .error-message {
      color: #ccc;
    }

    .dark .btn-secondary {
      color: #f8a5c2;
      border-color: #f8a5c2;
    }

    .dark .btn-secondary:hover {
      background: #f8a5c2;
      color: #2d1b3d;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .error-content {
        padding: 40px 20px;
      }

      .error-code {
        font-size: 80px;
      }

      .error-title {
        font-size: 24px;
      }

      .error-message {
        font-size: 16px;
      }

      .error-actions {
        flex-direction: column;
        align-items: center;
      }

      .btn-home, .btn-secondary {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <!-- Background decorations -->
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>

    <div class="error-content">
      <div class="error-illustration">🎨</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Oops! Page Not Found</h1>
      <p class="error-message">
        The page you're looking for seems to have vanished into thin air. 
        Don't worry - even masterpieces get misplaced sometimes!
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn-home">🏠 Back to Home</a>
        <a href="javascript:history.back()" class="btn-secondary">← Go Back</a>
      </div>
    </div>
  </div>

  <script>
    // Add some interactive elements
    document.addEventListener('DOMContentLoaded', function() {
      // Create floating paint drops
      const container = document.querySelector('.error-container');
      
      for (let i = 0; i < 5; i++) {
        const paintDrop = document.createElement('div');
        paintDrop.innerHTML = ['🎨', '🖌️', '✨', '🌟', '💫'][i];
        paintDrop.style.cssText = `
          position: absolute;
          font-size: ${Math.random() * 20 + 10}px;
          left: ${Math.random() * 100}%;
          top: ${Math.random() * 100}%;
          opacity: 0.3;
          animation: float ${Math.random() * 3 + 4}s ease-in-out infinite;
          animation-delay: ${Math.random() * 2}s;
          z-index: 1;
        `;
        container.appendChild(paintDrop);
      }

      // Add click effect to buttons
      const buttons = document.querySelectorAll('.btn-home, .btn-secondary');
      buttons.forEach(button => {
        button.addEventListener('click', function(e) {
          // Create ripple effect
          const ripple = document.createElement('span');
          ripple.style.cssText = `
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
          `;
          
          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
          
          this.style.position = 'relative';
          this.style.overflow = 'hidden';
          this.appendChild(ripple);
          
          setTimeout(() => ripple.remove(), 600);
        });
      });
    });

    // Add ripple animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
