<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | ART&INK</title>
  <link rel="icon" type="image/png" href="art-ink-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* 404 Page Specific Styles */
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f8a5c2 50%, #87cefa 75%, #667eea 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      position: relative;
      overflow: hidden;
    }

    .error-content {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 30px;
      padding: 80px 50px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 2;
      animation: slideUp 0.8s ease-out;
    }

    .error-code {
      font-size: 140px;
      font-weight: 900;
      background: linear-gradient(135deg, #f8a5c2, #87cefa, #764ba2);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 25px;
      text-shadow: 0 10px 30px rgba(248, 165, 194, 0.3);
      animation: float 4s ease-in-out infinite, glow 3s ease-in-out infinite alternate;
    }

    .error-title {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #333, #666);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 25px;
      line-height: 1.2;
      animation: fadeIn 1s ease-out 0.3s both;
    }

    .error-message {
      font-size: 20px;
      color: #555;
      margin-bottom: 50px;
      line-height: 1.6;
      animation: fadeIn 1s ease-out 0.6s both;
    }

    .error-actions {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeIn 1s ease-out 0.9s both;
    }

    .btn-home {
      background: linear-gradient(135deg, #f8a5c2, #87cefa);
      color: white;
      padding: 18px 40px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 25px rgba(248, 165, 194, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-home::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s;
    }

    .btn-home:hover::before {
      left: 100%;
    }

    .btn-home:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 35px rgba(248, 165, 194, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: #764ba2;
      padding: 18px 40px;
      border: 3px solid #764ba2;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .btn-secondary:hover {
      background: #764ba2;
      color: white;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 35px rgba(118, 75, 162, 0.4);
    }

    .error-illustration {
      font-size: 100px;
      margin-bottom: 40px;
      animation: bounce 3s ease-in-out infinite, rotate 10s linear infinite;
      filter: drop-shadow(0 10px 20px rgba(248, 165, 194, 0.3));
    }

    /* Enhanced Background decorations */
    .bg-decoration {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(248, 165, 194, 0.1), rgba(135, 206, 250, 0.1));
      animation: float 8s ease-in-out infinite;
      backdrop-filter: blur(5px);
    }

    .bg-decoration:nth-child(1) {
      width: 300px;
      height: 300px;
      top: 5%;
      left: 5%;
      animation-delay: 0s;
    }

    .bg-decoration:nth-child(2) {
      width: 200px;
      height: 200px;
      top: 60%;
      right: 10%;
      animation-delay: 3s;
    }

    .bg-decoration:nth-child(3) {
      width: 150px;
      height: 150px;
      bottom: 15%;
      left: 15%;
      animation-delay: 6s;
    }

    .bg-decoration:nth-child(4) {
      width: 100px;
      height: 100px;
      top: 20%;
      right: 20%;
      animation-delay: 9s;
    }

    /* Enhanced Animations */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(5deg); }
      50% { transform: translateY(-10px) rotate(-5deg); }
      75% { transform: translateY(-30px) rotate(3deg); }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-40px) scale(1.1); }
      60% { transform: translateY(-20px) scale(1.05); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes glow {
      from { filter: drop-shadow(0 10px 30px rgba(248, 165, 194, 0.3)); }
      to { filter: drop-shadow(0 15px 40px rgba(135, 206, 250, 0.4)); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Enhanced Dark mode support */
    .dark .error-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #2d1b3d 50%, #1a3a52 75%, #1a1a2e 100%);
      background-size: 400% 400%;
    }

    .dark .error-content {
      background: rgba(20, 20, 20, 0.98);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .dark .error-title {
      background: linear-gradient(135deg, #fff, #ccc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dark .error-message {
      color: #aaa;
    }

    .dark .btn-secondary {
      color: #f8a5c2;
      border-color: #f8a5c2;
    }

    .dark .btn-secondary:hover {
      background: #f8a5c2;
      color: #2d1b3d;
    }

    /* Enhanced Responsive design */
    @media (max-width: 768px) {
      .error-content {
        padding: 50px 25px;
        margin: 20px;
      }

      .error-code {
        font-size: 100px;
      }

      .error-title {
        font-size: 28px;
      }

      .error-message {
        font-size: 18px;
        margin-bottom: 40px;
      }

      .error-actions {
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .btn-home, .btn-secondary {
        width: 100%;
        max-width: 280px;
        padding: 16px 30px;
        font-size: 16px;
      }

      .error-illustration {
        font-size: 80px;
        margin-bottom: 30px;
      }

      .bg-decoration:nth-child(1) {
        width: 200px;
        height: 200px;
      }

      .bg-decoration:nth-child(2) {
        width: 150px;
        height: 150px;
      }

      .bg-decoration:nth-child(3) {
        width: 100px;
        height: 100px;
      }

      .bg-decoration:nth-child(4) {
        width: 80px;
        height: 80px;
      }
    }

    @media (max-width: 480px) {
      .error-content {
        padding: 40px 20px;
      }

      .error-code {
        font-size: 80px;
      }

      .error-title {
        font-size: 24px;
      }

      .error-message {
        font-size: 16px;
      }

      .btn-home, .btn-secondary {
        padding: 14px 25px;
        font-size: 15px;
      }
    }

    /* Navigation Bar */
    .nav-bar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 0;
    }

    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand a {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #f8a5c2, #87cefa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .nav-brand a:hover {
      transform: translateY(-1px);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav-links a {
      color: #666;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: #f8a5c2;
    }

    .nav-links a.active {
      color: #f8a5c2;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(135deg, #f8a5c2, #87cefa);
      border-radius: 1px;
    }

    .nav-footer {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
      color: #666;
    }

    .nav-footer .copyright {
      color: #666;
      font-weight: 500;
    }

    .nav-footer a {
      color: #666;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-footer a:hover {
      color: #f8a5c2;
    }

    @media (max-width: 768px) {
      .nav-content {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .nav-links {
        gap: 20px;
      }

      .nav-footer {
        font-size: 12px;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-brand a {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <div class="nav-content">
        <div class="nav-brand">
          <a href="index.html">ART&INK</a>
        </div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="faq.html">FAQ</a>
        </div>
        <div class="nav-footer">
          <span class="copyright"> 2026 ART&INK</span>
          <a href="#" onclick="openPrivacy(); return false;">Privacy Policy</a>
        </div>
      </div>
    </nav>

    <div class="error-container">
      <!-- Enhanced Background decorations -->
      <div class="bg-decoration"></div>
      <div class="bg-decoration"></div>
      <div class="bg-decoration"></div>
      <div class="bg-decoration"></div>

      <div class="error-content">
        <div class="error-illustration">🎨</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-message">
          The page you're looking for seems to have vanished into thin air. 
          Don't worry - even masterpieces get misplaced sometimes! 
          Let's get you back to creating something beautiful.
        </p>
        <div class="error-actions">
          <a href="index.html" class="btn-home">🏠 Back to Home</a>
          <a href="javascript:history.back()" class="btn-secondary">← Go Back</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Enhanced interactive elements
    document.addEventListener('DOMContentLoaded', function() {
      // Create enhanced floating paint drops
      const container = document.querySelector('.error-container');
      const paintEmojis = ['🎨', '🖌️', '✨', '🌟', '💫', '🎭', '🖼️', '🎪'];
      
      for (let i = 0; i < 8; i++) {
        const paintDrop = document.createElement('div');
        paintDrop.innerHTML = paintEmojis[i];
        paintDrop.style.cssText = `
          position: absolute;
          font-size: ${Math.random() * 25 + 15}px;
          left: ${Math.random() * 100}%;
          top: ${Math.random() * 100}%;
          opacity: 0.4;
          animation: float ${Math.random() * 4 + 5}s ease-in-out infinite;
          animation-delay: ${Math.random() * 3}s;
          z-index: 1;
          filter: drop-shadow(0 5px 10px rgba(248, 165, 194, 0.2));
        `;
        container.appendChild(paintDrop);
      }

      // Enhanced click effect for buttons
      const buttons = document.querySelectorAll('.btn-home, .btn-secondary');
      buttons.forEach(button => {
        button.addEventListener('click', function(e) {
          // Create multiple ripples
          for (let i = 0; i < 3; i++) {
            setTimeout(() => {
              const ripple = document.createElement('span');
              ripple.style.cssText = `
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.6);
                transform: scale(0);
                animation: ripple 0.8s ease-out;
                pointer-events: none;
              `;
              
              const rect = this.getBoundingClientRect();
              const size = Math.max(rect.width, rect.height);
              ripple.style.width = ripple.style.height = size + 'px';
              ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
              ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
              
              this.style.position = 'relative';
              this.style.overflow = 'hidden';
              this.appendChild(ripple);
              
              setTimeout(() => ripple.remove(), 800);
            }, i * 100);
          }
        });

        // Add hover sound effect (visual feedback)
        button.addEventListener('mouseenter', function() {
          this.style.transform = 'translateY(-3px) scale(1.05)';
        });

        button.addEventListener('mouseleave', function() {
          this.style.transform = 'translateY(0) scale(1)';
        });
      });

      // Add parallax effect on mouse move
      container.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 20;
        
        const decorations = document.querySelectorAll('.bg-decoration');
        decorations.forEach((decoration, index) => {
          const speed = (index + 1) * 0.5;
          decoration.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
        });
      });

      // Add keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const homeBtn = document.querySelector('.btn-home');
          if (document.activeElement === document.body) {
            homeBtn.click();
          }
        }
      });
    });

    // Enhanced ripple animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>

<script src="copyright.js"></script>
</body>
</html>
